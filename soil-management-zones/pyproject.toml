[project]
name = "soil-management-zones"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "scipy", "scikit-learn", "pillow", "rasterio", "pystac-client", "planetary-computer"]

[project.scripts]
soil-zones = "soil_zones.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soil_zones"]
