[project]
name = "llm-router"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx", "pydantic"]
[project.scripts]
llm-router = "llm_router:main"
[dependency-groups]
dev = ["pytest", "ruff"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
include = ["llm_router.py"]
[tool.ruff]
line-length = 100
