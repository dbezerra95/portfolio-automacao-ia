[project]
name = "ai-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "feedparser>=6", "pydantic>=2", "PyYAML>=6"]

[project.scripts]
ai-radar = "radar.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]
