name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - whatsapp-ai-agent
          - llm-router
          - rpa-collectors
          - lead-qualifier-agent
          - ai-radar
          - soil-management-zones
          - rpa-legacy-reconciliation
          - judicial-monitor
          - spark-ai-cascade
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: matrix.project == 'spark-ai-cascade'
        with:
          distribution: temurin
          java-version: '17'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run playwright install --with-deps chromium
        if: matrix.project == 'rpa-legacy-reconciliation'
      - run: uv run pytest -q
  test-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: instagram-auto-reply
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
