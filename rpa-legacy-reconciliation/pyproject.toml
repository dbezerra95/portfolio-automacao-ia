[project]
name = "rpa-legacy-reconciliation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "itsdangerous>=2.2", "playwright>=1.48", "openpyxl>=3.1", "python-dotenv>=1.0"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
rpa-conciliar = "rpa_legacy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["e2e: browser end-to-end test"]

[tool.hatch.build.targets.wheel]
packages = ["src/rpa_legacy"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
