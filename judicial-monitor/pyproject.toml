[project]
name = "judicial-monitor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2", "PyYAML>=6", "rich>=13"]

[project.scripts]
judicial-monitor = "judicial_monitor.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
