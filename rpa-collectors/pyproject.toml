[project]
name = "rpa-collectors"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4", "httpx", "playwright", "pydantic"]
[project.scripts]
collect = "collectors:main"
[dependency-groups]
dev = ["pytest", "ruff"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
include = ["collectors.py"]
[tool.ruff]
line-length = 100
